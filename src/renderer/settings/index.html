<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 顶部栏：和系统标题栏一样可以按住拖动整个窗口 -->
    <header class="titlebar"></header>

    <main class="page">
      <div class="page-head">
        <h1 id="title">设置</h1>
      </div>

      <div class="content">
        <section class="card">
          <h2 id="groupShortcuts">快捷窗口</h2>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbHotkey">呼出快捷窗口</div>
              <p class="hint" id="hintHotkey"></p>
            </div>
            <button id="hotkey" class="keycap" type="button">—</button>
          </div>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbNewChatShortcut">新对话</div>
              <p class="hint" id="hintNewChat"></p>
            </div>
            <button id="newChatShortcut" class="keycap" type="button">—</button>
          </div>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbHistoryShortcut">历史对话</div>
              <p class="hint" id="hintHistory"></p>
            </div>
            <button id="historyShortcut" class="keycap" type="button">—</button>
          </div>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbReset">重置为新聊天</div>
              <p class="hint" id="hintReset"></p>
            </div>
            <select id="resetAfter" class="select"></select>
          </div>
        </section>

        <section class="card">
          <h2 id="groupAppearance">外观与语言</h2>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbTheme">主题</div>
            </div>
            <select id="theme" class="select"></select>
          </div>

          <div class="row">
            <div class="row-text">
              <div class="label" id="lbLanguage">程序语言</div>
            </div>
            <select id="language" class="select"></select>
          </div>
        </section>

        <section class="account-bar">
          <div class="account-meta">
            <span class="label" id="lbVersion">版本号</span>
            <span class="value" id="version">—</span>
          </div>
          <button id="logout" class="logout" type="button">退出登录</button>
        </section>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <!-- 退出登录二次确认 -->
    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="alertdialog" aria-modal="true">
        <h2 id="confirmTitle">是否要退出登录？</h2>
        <p class="detail" id="confirmDetail"></p>
        <div class="sheet-actions">
          <button id="cancel" class="ghost" type="button">取消</button>
          <button id="confirmLogout" class="danger" type="button">退出登录</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
