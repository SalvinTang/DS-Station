<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 顶部栏：和系统标题栏一样可以按住拖动整个窗口 -->
    <header class="titlebar"></header>

    <main class="page">
      <h1 id="title">设置</h1>

      <section class="rows">
        <div class="row">
          <div class="label" id="lbHotkey">快捷窗口呼出快捷键</div>
          <button id="hotkey" class="keycap" type="button">—</button>
        </div>

        <div class="row">
          <div class="label" id="lbReset">重置为新聊天</div>
          <select id="resetAfter" class="select"></select>
        </div>

        <div class="row">
          <div class="label" id="lbLanguage">程序语言</div>
          <select id="language" class="select"></select>
        </div>

        <div class="row">
          <div class="label" id="lbTheme">主题</div>
          <select id="theme" class="select"></select>
        </div>

        <div class="row">
          <div class="label" id="lbVersion">版本号</div>
          <div class="value" id="version">—</div>
        </div>
      </section>

      <div class="status" id="status" role="status" aria-live="polite"></div>

      <footer class="footer">
        <button id="logout" class="logout" type="button">退出登录</button>
      </footer>
    </main>

    <!-- 退出登录二次确认 -->
    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="alertdialog" aria-modal="true">
        <h2 id="confirmTitle">是否要退出登录？</h2>
        <p class="detail" id="confirmDetail"></p>
        <div class="sheet-actions">
          <button id="cancel" class="ghost" type="button">取消</button>
          <button id="confirmLogout" class="danger" type="button">退出登录</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
