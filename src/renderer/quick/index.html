<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>快捷窗口</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" id="app" data-mode="empty">
      <!--
        顶部功能栏：鼠标移入才出现，移出 2 秒后隐藏（设计稿）。
        它是**浮在消息区上面**的绝对定位层，不占布局高度 ——
        所以收起来之后，下面的文字会自然顶上来。
        布局：左「关闭 扩大」，右「新对话」。
      -->
      <header class="topbar" id="topbar">
        <button id="tbClose" class="tb-btn" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18" />
            <path d="M6 6l12 12" />
          </svg>
        </button>

        <button id="tbExpand" class="tb-btn" type="button" title="在主窗口打开" aria-label="在主窗口打开">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6" />
            <path d="M9 21H3v-6" />
            <path d="M21 3l-7 7" />
            <path d="M3 21l7-7" />
          </svg>
        </button>

        <div class="spacer"></div>

        <button id="tbNewChat" class="tb-btn" type="button" title="新对话" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
      </header>

      <!-- ── 对话区（仅「有内容」态）── -->
      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <!-- ── 输入区 ── -->
      <div class="composer">
        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="给DeepSeek发送消息"
          spellcheck="false"
          autocomplete="off"
        ></textarea>

        <div class="toolbar">
          <button id="deepThink" class="tool-btn" type="button" aria-pressed="false"
                  title="深度思考" aria-label="深度思考">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.5l1.85 4.9 4.9 1.85-4.9 1.85L12 17l-1.85-4.9-4.9-1.85 4.9-1.85z" />
              <path d="M18.6 15.4l.75 1.95 1.95.75-1.95.75-.75 1.95-.75-1.95-1.95-.75 1.95-.75z" />
            </svg>
          </button>

          <button id="smartSearch" class="tool-btn" type="button" aria-pressed="false"
                  title="智能搜索" aria-label="智能搜索">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <path d="M3.5 12h17" />
              <path d="M12 3.5c2.2 2.3 3.4 5.3 3.4 8.5s-1.2 6.2-3.4 8.5c-2.2-2.3-3.4-5.3-3.4-8.5S9.8 5.8 12 3.5z" />
            </svg>
          </button>

          <div class="spacer"></div>

          <button id="send" class="send-btn" type="button" disabled title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5" />
              <path d="M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 复制按钮 / 消息模板 -->
    <template id="tplUser">
      <div class="msg-user">
        <div class="bubble"></div>
      </div>
      <div class="msg-actions right">
        <button class="copy-btn" type="button" title="复制" aria-label="复制"></button>
      </div>
    </template>

    <template id="tplAi">
      <div class="msg-ai">
        <div class="body"></div>
      </div>
      <div class="msg-actions">
        <button class="copy-btn" type="button" title="复制" aria-label="复制"></button>
      </div>
    </template>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
